# Деплой сайта на GitHub Pages.
#
# Зачем явный workflow вместо встроенного «deploy from branch»:
# встроенный пайплайн падал на шаге Deploy без внятной ошибки и его
# нельзя перезапустить из репозитория (05–06.07.2026).
#
# Почему два джоба: артефакт «github-pages» создаётся один раз в build;
# при повторном запуске упавшего deploy артефакт не пересоздаётся.
# (В одноджобной схеме re-run загружал второй артефакт с тем же именем,
# и deploy-pages падал: «Multiple artifacts named github-pages».)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Не гонять два деплоя одновременно; недокатившийся старый отменяем.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Шаг «path: .» выкладывал на боевой домен ВЕСЬ корень репозитория,
      # включая служебное. Проверено 11.08.2026: по адресам
      # /tools/zapusk-materialy.md, /tools/razvedka.md, /README.md
      # и /.DS_Store отдавался код 200. В материалах запуска лежали
      # промокод Директа, остаток счёта и номера кампаний — открытым
      # текстом на публичном домене.
      #
      # Теперь на сайт уезжает только то, что предназначено посетителю:
      # собираем витрину отдельной папкой и выкладываем её.
      #
      # content/ — данные афиши, из которых tools/events/stranicy.py собирает
      # готовые страницы. Сами страницы в витрину входят, исходные данные — нет:
      # правило «в корне лежит только то, что показываем» держим и для данных.
      - name: Собрать витрину без служебных файлов
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'tools' \
            --exclude 'content' \
            --exclude 'README.md' \
            --exclude '.gitignore' \
            --exclude '.DS_Store' \
            --exclude '*.py'
          echo "— в витрине:"; find _site -maxdepth 1 | sort

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          error_count: 15
          reporting_interval: 10000
