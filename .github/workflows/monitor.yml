# Наблюдение за доступностью сайта.
#
# Появилось после 17.08.2026: сайт почти сутки не открывался из московских
# сетей, реклама всё это время работала, а узнали об этом случайно — клиент
# не смог зайти с телефона. Обычные сервисы наблюдения ходят из Европы,
# и в тот день у них было зелено. Поэтому решающий замер здесь — российский.
#
# Уведомление не требует ни ключей, ни сторонних служб: упавшая сборка
# заставляет GitHub написать письмо владельцу репозитория. Тема письма —
# имя этой сборки, поэтому оно названо по-человечески.
#
# Внимание: расписание в GitHub неточное — запуск может уехать на несколько
# минут или пропуститься под нагрузкой. Для отлова многочасовых поломок
# этого достаточно, для секундных — нет, но такой задачи и не стоит.
# Ещё: после 60 дней без единого коммита GitHub отключает расписание сам.
name: Сайт недоступен?

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  proverka:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Проверить сайт снаружи и из России
        run: python3 tools/monitor/proverka.py
